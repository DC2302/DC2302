name: Racing weights (weekly)

# Re-fits the model weights on the stored charts, holding out the last seven
# days, then re-scores the season and commits the result.
on:
  schedule:
    - cron: '0 13 * * 1' # Mondays, 9:00 am US Eastern (8:00 during standard time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: racing-data
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: racing-picks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: racing-picks/package-lock.json
      - run: npm ci
      - name: Fit weights (last 7 days held out)
        run: node scripts/fit-weights.mjs --holdout 7 --warmup 14 --out data/weights.json
      - name: Re-score the season
        run: node scripts/score-history.mjs
      - name: Commit data
        run: |
          git config user.name "racing-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "racing data: weights re-fitted $(date -u +%F) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
